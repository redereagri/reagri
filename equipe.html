<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipe – REAGRI</title>
<meta name="description" content="Rede de Pesquisas sobre Regiões Agrícolas (REAGRI) – grupo de pesquisa certificado pelo CNPq, sediado na UECE.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="equipe">
<div class="wrap">
<header id="site-header"></header>
<main id="conteudo">
<section class="page-head">
  <div class="kicker">Pessoas</div>
  <h1 class="display" style="margin-top:12px">Equipe</h1>
  <div class="stats" id="stats"></div>
  <div class="leaders" id="lideres"></div>
  <label class="search">Buscar por nome
    <input id="busca" type="search" placeholder="Digite um nome…" autocomplete="off">
  </label>
</section>

<section class="section split">
  <div class="side"><h2 class="h2">Pesquisadores</h2></div>
  <ul class="names main" id="pesquisadores"></ul>
</section>

<section class="section split">
  <div class="side"><h2 class="h2">Estudantes</h2><p class="muted">Por nível de treinamento.</p></div>
  <div class="main" id="estudantes"></div>
</section>

<section class="section split">
  <div class="side"><h2 class="h2">Colaboração estrangeira</h2></div>
  <ul class="names main" id="colaboradores"></ul>
</section>

<section class="section split">
  <div class="side"><h2 class="h2">Egressos</h2></div>
  <ul class="names main" id="egressos"></ul>
</section>
</main>
<footer id="site-footer"></footer>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
